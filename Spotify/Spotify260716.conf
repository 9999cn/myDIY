# Spotify 2026 自托管圈 X 兼容版
# 完美解决频繁掉线和登录验证问题

[rewrite_local]
# 核心修正：双重拦截，删除本地缓存验证，强制服务器返回最新数据走你的 JS 脚本
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ request-header-del If-None-Match
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ request-header-del If-Modified-Since

# 专辑和艺术家解析 (指向你个人的 GitHub 脚本)
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/ url script-request-header https://raw.githubusercontent.com/9999cn/myDIY/refs/heads/main/Spotify/spotify-json.js

# 核心初始化鉴权 (指向你个人的 GitHub 脚本，使用 proto 模式确保二进制解析正常)
^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$ url script-response-body https://raw.githubusercontent.com/9999cn/myDIY/refs/heads/main/Spotify/spotify-proto.js

[mitm]
hostname = spclient.wg.spotify.com, *spclient.spotify.com
